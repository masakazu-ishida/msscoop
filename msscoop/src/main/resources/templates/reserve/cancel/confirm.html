<html xmlns:th="http://www.thymeleaf.org">
	<head th:replace="~{/common/head}">
	</head>
	<body>
	    <!-- (2)body内で共通化したい部品をfragment化する -->
	    <header th:replace="~{/common/header}"></header>
		<span class="text-danger"
							             th:if="${errormsg != null}"
							             th:text="${errormsg}">
							               search error </span>
		<main>
			<h2>予約キャンセル画面</h2>
			<p>以下の内容でキャンセルします</p>
			<form th:action="@{/reserve/cancel}" th:object="${cancelForm}"  method="post">
				<table>
					<tr><td>日付</td><td th:text="*{ #temporals.format(checkIn, 'yyyy-MM-dd')} "></tr>
					<tr><td>部屋名</td><td th:text="*{roomName}"></td></tr>
					<tr><td>お部屋イメージ</td><td><img th:src="@{*{roomImage}}"/></td></tr>
					<tr><td>内風呂</td><td th:text="*{inDoorBathRoom == false } ? 'なし' : 'あり'"></td> </tr>
					<tr><td>喫煙</td><td th:text="*{smoking == false} ? '喫煙OK' : '禁煙'"></td> </tr>
					<tr><td>1名1泊 </td><td th:text="${#numbers.formatInteger(cancelForm.price, 3, 'COMMA') + '円'}"></td> </tr>
					<tr><td>宿泊人数</td><td th:text="*{stayNumberOfPeople}"></td></tr>
					<tr><td>食事</td><td th:text="*{meal} ? 'あり' : 'なし'"></td></tr>
					<tr><td>合計金額 </td><td th:text="*{#numbers.formatInteger(amount, 3, 'COMMA') + '円'}"></td> </tr>
					<tr><td><input type="submit" name="commit" value="予約キャンセル"></td></tr>
				</table>
			</form>			
		</main>
		<footer th:replace="~{/common/footer}"></footer>
	</body>
</html>
